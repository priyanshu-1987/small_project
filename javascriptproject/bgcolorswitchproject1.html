<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript progect 1</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            border-radius: 50px;
            display: flex;
            justify-content: center;  
            align-items: center
           
        }
        .buttons{
            display: inline-flex;
        }
        #gray{
            background-color:gray ;
            justify-content: center;  
            align-items: center
            
        }
        #pink{
            background-color:pink ;
        }
        #blue{
            background-color:blue;
        }
        #yellow{
            background-color:yellow ;
        }
    </style>
</head>
<body style="background-color: black; color: green;">
 
    <h1>
        Color Scheme Switcher
    </h1>
    <div class="buttons" id="gray">gray</div>
    <div class="buttons" id="pink">pink</div>
    <div class="buttons" id="blue">blue</div>
    <div class="buttons" id="yellow">yellow</div>
    <h2>Try clicking on one of the colors above
        <span>to change the background color of this page</span>
    </h2>
    <script src="project1.js"></script>
</body>
</html>
